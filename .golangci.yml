version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errname
    - errorlint
    - godoclint
    - gosec
    - mirror
    - nolintlint
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true

    gosec:
      excludes:
        - G115 # integer overflow — noisy for provider constants

    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  max-same-issues: 10
