name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Compile
        run: go build -trimpath ./...

      - name: Vet
        run: go vet ./...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Test
        run: go test -trimpath -count=1 -race ./internal/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npx markdownlint-cli2

      - name: Spell
        run: npx cspell lint "**/*.md"

      - name: Links
        run: npx markdown-link-check --quiet --config .markdown-link-check.json docs

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'
          terraform_wrapper: false

      - name: Build
        run: go build -trimpath -o terraform-provider-platctx .

      - name: Test
        run: TF_ACC=1 go test -trimpath -count=1 -v ./tests/...
